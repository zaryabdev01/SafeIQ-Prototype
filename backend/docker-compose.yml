services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: safeiq
      POSTGRES_PASSWORD: safeiq
      POSTGRES_DB: safeiq
    ports:
      - "5432:5432"
    volumes:
      - safeiq_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U safeiq"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://safeiq:safeiq@db:5432/safeiq
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./app:/app/app
      - ./alembic:/app/alembic
    command: >
      sh -c "python scripts/init_db.py && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  safeiq_db_data:
